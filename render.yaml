services:
  - type: web
    name: lineless-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lineless-db
          property: connectionString

databases:
  - name: lineless-db
    plan: free